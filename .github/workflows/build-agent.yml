name: Build Windows Agent (.exe)

on:
  # Build AND publish a GitHub Release whenever a version tag (vX.Y.Z) is pushed.
  push:
    tags:
      - 'v*'
  # Manual trigger from the Actions tab — builds a downloadable artifact from any
  # branch (no Release). Use this to test a build without cutting a release.
  workflow_dispatch:

permissions:
  contents: write   # required to create GitHub Releases and upload assets

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-windows.txt

      - name: Build with PyInstaller
        run: pyinstaller agent.spec --clean --noconfirm

      - name: Verify build
        run: |
          if (Test-Path "dist\WitzoneAgent.exe") {
            $size = (Get-Item "dist\WitzoneAgent.exe").Length / 1MB
            Write-Host "Build successful: WitzoneAgent.exe ($([math]::Round($size,1)) MB)"
          } else {
            Write-Host "ERROR: exe not found"
            exit 1
          }
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Build installer (WitzoneAgentSetup.exe)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
        shell: pwsh

      - name: Verify installer
        run: |
          if (Test-Path "installer_output\WitzoneAgentSetup.exe") {
            $size = (Get-Item "installer_output\WitzoneAgentSetup.exe").Length / 1MB
            Write-Host "Installer built: WitzoneAgentSetup.exe ($([math]::Round($size,1)) MB)"
          } else {
            Write-Host "ERROR: installer not found"
            exit 1
          }
        shell: pwsh

      - name: Upload artifacts (raw exe + installer)
        uses: actions/upload-artifact@v4
        with:
          name: WitzoneAgent-Windows
          path: |
            desktop-agent/dist/WitzoneAgent.exe
            desktop-agent/installer_output/WitzoneAgentSetup.exe
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-agent/dist/WitzoneAgent.exe
            desktop-agent/installer_output/WitzoneAgentSetup.exe
          name: Witzone Agent ${{ github.ref_name }}
          body: |
            ## Witzone Workspace Agent ${{ github.ref_name }}

            ### Installation (recommended)
            1. Download **`WitzoneAgentSetup.exe`** (the installer).
            2. Run it (accept the Windows admin prompt). It installs to Program Files
               and registers in **Control Panel → Programs & Features**.
            3. The agent launches and appears in the system tray.
            4. Right-click the tray icon → **Login / Re-authenticate**, enter the
               employee's email and password. Credentials are saved; from then on it
               auto-starts on Windows login and tracks automatically.

            ### Uninstall
            Control Panel → **Programs & Features** → **Witzone Workspace Agent** →
            Uninstall. (Stops the agent and removes it cleanly.)

            ### Portable option
            `WitzoneAgent.exe` is also attached if you prefer to run it without
            installing.
